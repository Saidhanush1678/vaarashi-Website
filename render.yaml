
services:
  - type: web
    name: vaaraahi-dry-cleaners
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: BUSINESS_PHONE
        value: "917981903060"
      - key: BUSINESS_ADDRESS
        value: "Kishanpura, Hanamkonda"
      - key: DATABASE_PATH
        value: /var/data/vaaraahi.db
    disk:
      name: vaaraahi-data
      mountPath: /var/data
      sizeGB: 1
